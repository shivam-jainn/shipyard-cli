name: Security

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read
  security-events: write

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    steps:
      # See build-mbp.yml: the engine checkout exports GIT_SSH_COMMAND for the
      # whole job, which then leaks into the HTTPS CLI checkout and fails with
      # 'Host key verification failed'. A stable known_hosts avoids the
      # ordering dependency.
      - name: Set up known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          sort -u ~/.ssh/known_hosts -o ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Checkout CLI
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: go
          queries: security-and-quality

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:go'

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      # See build-mbp.yml: the engine checkout exports GIT_SSH_COMMAND for the
      # whole job, which then leaks into the HTTPS CLI checkout and fails with
      # 'Host key verification failed'. A stable known_hosts avoids the
      # ordering dependency.
      - name: Set up known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          sort -u ~/.ssh/known_hosts -o ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Checkout CLI
        uses: actions/checkout@v4

      - name: Checkout Engine (shipyard-core)
        uses: actions/checkout@v4
        with:
          repository: shivam-jainn/shipyard-core
          # GITHUB_TOKEN is scoped to this repository and cannot read the
          # private engine, so a read-only deploy key is used instead of a PAT.
          # Forks do not receive secrets, hence the empty-string fallback.
          ssh-key: ${{ secrets.CORE_SSH_KEY }}
          ssh-strict: false
          path: shipyard-core

      # actions/checkout cannot write outside the workspace, so the engine is
      # moved up to the sibling path that the go.mod `replace` directive needs.
      - name: Move engine to sibling directory
        run: |
          rm -rf "$GITHUB_WORKSPACE/../shipyard-core"
          mv shipyard-core "$GITHUB_WORKSPACE/../shipyard-core"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Scan
        run: govulncheck ./...

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
