name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # The engine lives in shipyard-core and is resolved via a `replace`
      # directive, so it must sit next to this checkout.
      - name: Checkout Engine (shipyard-core)
        uses: actions/checkout@v4
        with:
          repository: shivam-jainn/shipyard-core
          path: shipyard-core

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Download Dependencies
        run: go mod download

      - name: Verify Dependencies
        run: go mod verify

      - name: Run Tests
        run: go test -v -race ./...

      - name: Build Binary (Stripped)
        run: |
          mkdir -p bin
          go build -ldflags="-s -w -X 'github.com/shivam-jainn/shipyard-cli/cmd/cmdline.Version=ci-${{ github.sha }}'" -o bin/shipyard ./cmd/shipyard/main.go
          ./bin/shipyard version
