name: Package

# Builds distro packages from published release artifacts.
#
# Runs on the self-hosted Linux runner (`shipyard-linux`) because .deb/.rpm are
# Linux formats: a macOS host cannot meaningfully build or install-test them.
# The binaries themselves are cross-compiled on the Mac by build-mbp.yml.
#
# Swapping this VM for the Pi needs no edit here: the job selects on the
# `packaging` label. See docs/RUNNERS.md.

on:
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to package (e.g. v0.0.1-alpha.1)'
        required: true

permissions:
  contents: read

concurrency:
  group: package-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  linux-packages:
    name: deb/rpm/arch
    runs-on: [ self-hosted, linux-build, packaging ]
    steps:
      - name: Checkout CLI
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: ver
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          TAG="${TAG#v}"
          echo "version=$TAG" >> "$GITHUB_OUTPUT"
          echo "::notice::packaging $TAG"

      - name: Install nfpm
        run: |
          set -euo pipefail
          NFPM=v2.41.3
          curl -sfL -o nfpm.tgz \
            "https://github.com/goreleaser/nfpm/releases/download/${NFPM}/nfpm_${NFPM}_Linux_$(uname -m).tar.gz"
          tar xzf nfpm.tgz nfpm
          sudo install -m755 nfpm /usr/local/bin/nfpm
          rm nfpm.tgz
          nfpm --version | head -2

      - name: Fetch linux tarballs from the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p tarballs stage
          gh release download "$TAG" --pattern "shipyard-${TAG}-linux-*.tar.gz" --dir tarballs
          for arch in amd64 arm64; do
            f="tarballs/shipyard-${TAG}-linux-${arch}.tar.gz"
            [ -f "$f" ] || { echo "::error::missing $f"; exit 1; }
            mkdir -p "stage/$arch"
            tar xzf "$f" -C "stage/$arch"
            echo "== $arch"; file "stage/$arch/shipyard"
          done

      - name: Build packages
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p packages
          # nfpm takes the arch and the binary path from the config, not from
          # flags, so each (packager, arch) pair gets a generated config.
          # VERSION is exported because nfpm expands ${VERSION} from the env.
          export VERSION
          build() {
            local packager="$1" nfpm_arch="$2" src_arch="$3"
            local src="stage/${src_arch}/shipyard"
            [ -f "$src" ] || { echo "::error::no binary for ${src_arch}"; return 1; }
            local cfg="packaging/.nfpm-${packager}-${nfpm_arch}.yaml"
            sed -e "s|^arch: .*|arch: ${nfpm_arch}|" \
                -e "s|src: \./dist/shipyard|src: ./${src}|" \
                packaging/nfpm.yaml > "$cfg"
            nfpm package --config "$cfg" --packager "$packager" --target packages
          }
          for arch in amd64 arm64; do
            build deb amd64         "$arch"
            build deb arm64         "$arch"
            build rpm x86_64        "$arch"
            build rpm aarch64       "$arch"
            build archlinux x86_64  "$arch"
            build archlinux aarch64 "$arch"
          done
          rm -f packaging/.nfpm-*.yaml
          ls -la packages

      - name: Verify packages
        run: |
          set -euo pipefail
          fail=0
          n=0
          for deb in packages/*.deb; do
            n=$((n+1))
            dpkg-deb -I "$deb" >/dev/null || { echo "FAIL control: $deb"; fail=1; }
            dpkg-deb -c "$deb" | grep -qE 'usr/local/bin/shipyard' || { echo "FAIL contents: $deb"; fail=1; }
          done
          for rpm in packages/*.rpm; do
            n=$((n+1))
            rpm -qip "$rpm" >/dev/null || { echo "FAIL unreadable: $rpm"; fail=1; }
            rpm -qlp "$rpm" | grep -qE 'usr/bin/shipyard' || { echo "FAIL contents: $rpm"; fail=1; }
          done
          for pkg in packages/*.pkg.tar.zst; do
            n=$((n+1))
            zstd -dc "$pkg" 2>/dev/null | tar tf - 2>/dev/null | grep -q 'usr/bin/shipyard' \
              || { echo "FAIL contents: $pkg"; fail=1; }
          done
          echo "verified $n packages"
          exit $fail

      - name: Install-test the deb
        run: |
          set -euo pipefail
          deb="$(ls packages/*amd64.deb | head -1)"
          echo "installing $deb"
          sudo dpkg -i "$deb"
          command -v shipyard
          if [ "$(uname -m)" = "x86_64" ]; then
            shipyard version
          else
            echo "::notice::amd64 deb on an arm64 host; skipping exec test"
          fi
          sudo dpkg -r shipyard
          echo "install/uninstall OK"

      - name: Checksums
        run: |
          set -euo pipefail
          cd packages
          ( sha256sum *.deb *.rpm *.pkg.tar.zst 2>/dev/null || shasum -a 256 * ) > checksums.txt
          cat checksums.txt

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: packages/*
          if-no-files-found: error

  homebrew:
    name: Homebrew formula
    runs-on: [ self-hosted, mbp ]
    steps:
      - name: Checkout CLI
        uses: actions/checkout@v4

      - name: Download darwin tarballs
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p src
          gh release download "$TAG" \
            --pattern "shipyard-${TAG}-darwin-arm64.tar.gz" \
            --pattern "shipyard-${TAG}-darwin-amd64.tar.gz" \
            --dir src
          ls -la src

      - name: Generate and verify the formula
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          V="${TAG#v}"
          ARM_SHA=$(shasum -a 256 "src/shipyard-${TAG}-darwin-arm64.tar.gz" | cut -d' ' -f1)
          AMD_SHA=$(shasum -a 256 "src/shipyard-${TAG}-darwin-amd64.tar.gz" | cut -d' ' -f1)
          cat > shipyard.rb <<EOF
          class Shipyard < Formula
            desc "Evaluation harness and execution engine for autonomous AI agents"
            homepage "https://github.com/shivam-jainn/shipyard-cli"
            version "${V}"
            license "Apache-2.0"

            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/shivam-jainn/shipyard-cli/releases/download/${TAG}/shipyard-${TAG}-darwin-arm64.tar.gz"
                sha256 "${ARM_SHA}"
              else
                url "https://github.com/shivam-jainn/shipyard-cli/releases/download/${TAG}/shipyard-${TAG}-darwin-amd64.tar.gz"
                sha256 "${AMD_SHA}"
              end
            end

            def install
              if Hardware::CPU.arm?
                bin.install "shipyard-${TAG}-darwin-arm64/shipyard" => "shipyard"
              else
                bin.install "shipyard-${TAG}-darwin-amd64/shipyard" => "shipyard"
              end
            end

            test do
              assert_match "shipyard version", shell_output("#{bin}/shipyard version")
            end
          end
          EOF
          echo "--- generated formula ---"
          cat shipyard.rb
          # Verify both tarballs contain the binary the formula expects.
          for a in arm64 amd64; do
            tar tzf "src/shipyard-${TAG}-darwin-${a}.tar.gz" | grep -q shipyard \
              || { echo "::error::darwin/${a} tarball has no binary"; exit 1; }
          done

      - name: Upload formula
        uses: actions/upload-artifact@v4
        with:
          name: homebrew-formula
          path: shipyard.rb
          if-no-files-found: error
