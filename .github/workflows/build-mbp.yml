name: Build (self-hosted MBP)

# Builds the full release matrix on push to main/develop, and verifies pull
# requests. Runs on the self-hosted MacBook Pro runner (`shivams-mbp`).
#
# Note on layout: go.mod wires the engine in with a filesystem `replace`
# directive pointing at `../shipyard-core`, so the engine MUST be checked out
# as a SIBLING of this repo, not a subdirectory. `actions/checkout` resolves
# `path` relative to the workspace, hence `../shipyard-core`.

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-mbp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: [ self-hosted, mbp ]
    steps:
      - name: Checkout CLI
        uses: actions/checkout@v4

      # Read-only deploy key; the private engine is not reachable by GITHUB_TOKEN.
      # actions/checkout refuses a path outside the workspace, so it lands in a
      # subdir and is then moved up to the sibling location the replace wants.
      - name: Checkout Engine (shipyard-core)
        uses: actions/checkout@v4
        with:
          repository: shivam-jainn/shipyard-core
          path: shipyard-core
          ssh-key: ${{ secrets.CORE_SSH_KEY }}

      - name: Move engine to sibling directory
        run: |
          # Clear any leftover from a previous job in this run before moving.
          rm -rf "$GITHUB_WORKSPACE/../shipyard-core"
          mv shipyard-core "$GITHUB_WORKSPACE/../shipyard-core"
          echo "engine at $(cd "$GITHUB_WORKSPACE/../shipyard-core" && pwd)"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: |
            go.sum

      - name: Download dependencies
        run: |
          go mod download
          go mod verify

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: verify
    runs-on: [ self-hosted, mbp ]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
    steps:
      - name: Checkout CLI
        uses: actions/checkout@v4

      - name: Checkout Engine (shipyard-core)
        uses: actions/checkout@v4
        with:
          repository: shivam-jainn/shipyard-core
          path: shipyard-core
          ssh-key: ${{ secrets.CORE_SSH_KEY }}

      - name: Move engine to sibling directory
        run: |
          # Clear any leftover from a previous job in this run before moving.
          rm -rf "$GITHUB_WORKSPACE/../shipyard-core"
          mv shipyard-core "$GITHUB_WORKSPACE/../shipyard-core"
          echo "engine at $(cd "$GITHUB_WORKSPACE/../shipyard-core" && pwd)"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: |
            go.sum

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          VERSION="$(tr -d '[:space:]' < VERSION)"
          SHA="$(git rev-parse --short HEAD)"
          BUILD_VERSION="${VERSION}-dev.${SHA}"
          CHANNEL=dev
          PKG=github.com/shivam-jainn/shipyard-cli/cmd/cmdline
          LDFLAGS="-s -w -buildid="
          LDFLAGS="${LDFLAGS} -X '${PKG}.Version=${BUILD_VERSION}'"
          LDFLAGS="${LDFLAGS} -X '${PKG}.Commit=${SHA}'"
          LDFLAGS="${LDFLAGS} -X '${PKG}.Channel=${CHANNEL}'"
          go build -trimpath -mod=readonly -ldflags="${LDFLAGS}" \
            -o "dist/shipyard-${BUILD_VERSION}-${{ matrix.goos }}-${{ matrix.goarch }}" \
            ./cmd/shipyard/main.go
          tar -czf "dist/shipyard-${BUILD_VERSION}-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz" \
            -C dist "shipyard-${BUILD_VERSION}-${{ matrix.goos }}-${{ matrix.goarch }}"

      - name: Checksums
        run: |
          cd dist
          shasum -a 256 *.tar.gz > checksums.txt
          cat checksums.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: shipyard-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error
